name: Windows signing check

# Manual diagnostic (no release): 1) sign a throwaway executable directly, 2) run the real tauri build
# with signing and print the wrapper's log. Trigger with `gh workflow run windows-signing-check.yml`.
on:
  workflow_dispatch:

jobs:
  direct:
    runs-on: windows-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Install artifact-signing-cli
        run: cargo install artifact-signing-cli --locked
      - name: Sign a test file
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          Copy-Item "$env:SystemRoot\System32\whoami.exe" "$env:RUNNER_TEMP\test.exe"
          artifact-signing-cli -e https://weu.codesigning.azure.net -a mksp-trusted-signing -c MKSP-Windows-Signature -d "Fusion LCSC Library Manager" "$env:RUNNER_TEMP\test.exe"

  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - name: Install artifact-signing-cli
        run: cargo install artifact-signing-cli --locked
      - name: tauri build with signing (verbose)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run tauri build -- --verbose
      - name: Windows signing log
        if: always()
        shell: pwsh
        run: if (Test-Path "$env:RUNNER_TEMP\sign-windows.log") { Get-Content "$env:RUNNER_TEMP\sign-windows.log" } else { 'no sign log' }
      - name: Verify signatures
        if: always()
        shell: pwsh
        run: Get-ChildItem src-tauri\target\release\bundle -Recurse -Include *.exe,*.msi | ForEach-Object { $_.FullName; (Get-AuthenticodeSignature $_.FullName) | Format-List Status, StatusMessage }
